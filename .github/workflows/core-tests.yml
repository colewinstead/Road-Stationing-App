name: RoadStationCore
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - run: swift --version
      - run: swift test
      - run: swift test -c release
      - name: Test Apple CRS adapter against NGA PROJ
        if: runner.os == 'macOS'
        run: swift test --package-path RoadStationApp/CRSAdapter
      - name: Validate and export sample cases
        run: swift run roadstation-validate Tests/Fixtures/tangent-only.xml Tests/Fixtures/validation-cases.json validation-output/analytic
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: validation-output/

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build Phase 2A iPhone harness
        run: >-
          xcodebuild -project RoadStationApp/RoadStationApp.xcodeproj
          -scheme RoadStationApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
