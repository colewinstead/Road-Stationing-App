name: RoadStationCore
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - run: swift --version
      - run: swift test
      - run: swift test -c release
      - name: Test Apple CRS, field-position and saved-project packages
        if: runner.os == 'macOS'
        run: swift test --package-path RoadStationApp/CRSAdapter
      - name: Check catalog matches pinned NGA database
        if: runner.os == 'macOS'
        run: python3 tools/Generate-CRS-Catalog.py --check
      - name: Test Apple catalog and pipeline in Release
        if: runner.os == 'macOS'
        run: swift test --package-path RoadStationApp/CRSAdapter -c release
      - name: Validate and export sample cases
        run: swift run roadstation-validate Tests/Fixtures/tangent-only.xml Tests/Fixtures/validation-cases.json validation-output/analytic
      - name: Validate CROSSGATES real ORD cases
        run: >-
          swift run roadstation-validate
          Validation/RealORD/CROSSGATES/CROSSGATES.xml
          Validation/RealORD/CROSSGATES/CROSSGATES-ord-cases.json
          validation-output/CROSSGATES
      - name: Validate public App Store example
        run: swift run roadstation-validate AppStore/sample.landxml AppStore/sample-cases.json validation-output/app-store/sample
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: validation-output/

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build RoadStationApp iPhone Simulator
        run: >-
          xcodebuild -project RoadStationApp/RoadStationApp.xcodeproj
          -scheme RoadStationApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Select available iPhone Simulator
        run: |
          xcrun simctl list --json > "$RUNNER_TEMP/roadstation-simulators.json"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          inventory = json.loads((Path(os.environ["RUNNER_TEMP"]) / "roadstation-simulators.json").read_text())
          runtimes = sorted(
              (runtime for runtime in inventory["runtimes"]
               if runtime["isAvailable"] and ".iOS-" in runtime["identifier"]),
              key=lambda runtime: tuple(map(int, runtime["version"].split("."))),
              reverse=True,
          )
          for runtime in runtimes:
              devices = inventory["devices"].get(runtime["identifier"], [])
              device = next((device for device in devices
                             if device["isAvailable"] and device["name"].startswith("iPhone")), None)
              if device is not None:
                  destination = f"platform=iOS Simulator,name={device['name']},OS={runtime['version']}"
                  with open(os.environ["GITHUB_ENV"], "a") as environment:
                      environment.write(f"IOS_SIMULATOR_DESTINATION={destination}\n")
                      environment.write(f"IOS_SIMULATOR_ID={device['udid']}\n")
                  print(f"Selected {destination}")
                  break
          else:
              raise SystemExit("No available iPhone Simulator with an installed iOS runtime.")
          PY
      - name: Test CRS, field position and saved projects on iOS Simulator
        run: >-
          xcodebuild -project RoadStationApp/RoadStationApp.xcodeproj
          -scheme RoadStationCRSTests -configuration Debug
          -destination "$IOS_SIMULATOR_DESTINATION"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Test full app UI including saved-project cold start
        run: tools/Test-iOS-Harness.sh "$IOS_SIMULATOR_ID"

      - name: Build unsigned Release for iPhone and check shipped resources
        run: |
          xcodebuild -project RoadStationApp/RoadStationApp.xcodeproj -scheme RoadStationApp -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/roadstation-release" CODE_SIGNING_ALLOWED=NO build
          python3 tools/Check-Release-App.py "$RUNNER_TEMP/roadstation-release/Build/Products/Release-iphoneos/RoadStationApp.app"
      - name: Test Release store readiness through Files
        run: tools/Test-iOS-Harness.sh "$IOS_SIMULATOR_ID" Release
